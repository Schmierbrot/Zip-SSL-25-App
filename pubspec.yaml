name: zip_app
description: "App für die Piaggio Zip SSL 25 – Live-Daten, Licht und Fahrten vom ESP32-S3 per Bluetooth LE."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Bluetooth Low Energy
  flutter_blue_plus: ^2.3.13
  # State Management
  flutter_riverpod: ^3.4.3
  # Karte (OpenStreetMap-basiert, ohne API-Key)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # Diagramme
  fl_chart: ^1.2.0
  # Lokale Speicherung
  sqflite: ^2.4.4
  path: ^1.9.1
  shared_preferences: ^2.5.5
  # Schrift Inter (liegt gebündelt unter assets/google_fonts)
  google_fonts: ^8.2.1
  # GPX-Export
  share_plus: ^13.3.0
  # Bildschirm auf dem Dashboard anlassen
  wakelock_plus: ^1.8.0
  # App-Version für die Info-Seite
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/google_fonts/
