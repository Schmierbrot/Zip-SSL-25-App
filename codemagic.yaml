# Codemagic: iOS-App als IPA bauen.
#
#   ios-ipa   Unsignierte IPA zum Sideloaden (Sideloadly, AltStore …) – kein
#             Apple-Developer-Konto nötig; signiert wird beim Installieren mit der
#             eigenen Apple-ID.
#
# Läuft auf mac_mini_m2 (im kostenlosen Plan enthalten). Start: „Start new build“.
# Die IPA liegt danach auf der Build-Seite unter „Artifacts“.

workflows:
  ios-ipa:
    name: iOS-IPA (unsigniert)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pakete laden
        script: |
          flutter pub get
      - name: Unit-Tests
        script: |
          flutter test
      - name: iOS bauen (ohne Signatur)
        script: |
          flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER
      - name: IPA packen
        script: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          rm -rf build/ios/ipa-payload build/ios/ipa
          mkdir -p build/ios/ipa-payload/Payload build/ios/ipa
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa-payload/Payload/
          cd build/ios/ipa-payload
          zip -qry "../ipa/Zip-$VERSION-$BUILD_NUMBER.ipa" Payload
          ls -lh ../ipa
    artifacts:
      - build/ios/ipa/*.ipa

  # ---------------------------------------------------------------------------
